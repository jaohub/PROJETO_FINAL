<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Criar Nova Tarefa — {{ projeto[1] }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Fundo unificado com o gradiente das demais telas */
        body.form-page-body {
            background: linear-gradient(135deg, #182848, #4b6cb7) !important;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .form-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Card Transparente (Glassmorphism) */
        .form-card {
            background: rgba(255, 255, 255, 0.15); /* Transparência branca */
            backdrop-filter: blur(10px); /* Vidro fosco */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        /* Cabeçalho do Card */
        .form-card-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-context {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-card-header h2 {
            color: #ffffff;
            margin: 0;
            font-size: 24px;
            letter-spacing: 0.5px;
        }

        /* Estrutura de grupos e labels */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .flex-1 {
            flex: 1;
        }

        .form-group label {
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Customização dos Inputs, Selects e Textarea */
        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 4px;
            font-size: 14px;
            color: #333333;
            box-sizing: border-box;
            font-family: inherit;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            outline: none;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* Correção para altura do select */
        .form-group select {
            height: 43px;
        }

        /* Ações e Botões */
        .form-actions {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: center;
        }

        /* Botão verde mantendo o destaque original */
        .btn-submit-task {
            width: 100%;
            padding: 14px;
            background-color: #2ca35c;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-submit-task:hover {
            background-color: #217d46;
        }

        /* Link para retornar */
        .btn-cancel-task {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s ease;
        }

        .btn-cancel-task:hover {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>
<body class="form-page-body">

    <main class="form-container">
        <div class="form-card">
            <header class="form-card-header">
                <span class="form-context">Módulo: {{ projeto[1] }}</span>
                <h2>Criar Nova Atividade</h2>
            </header>

            <form action="{{ url_for('nova_tarefa', projeto_id=projeto[0]) }}" method="POST" class="task-form">
                
                <div class="form-group">
                    <label for="titulo">Título da Tarefa</label>
                    <input type="text" id="titulo" name="titulo" placeholder="O que precisa ser feito?" required autocomplete="off">
                </div>

                <div class="form-row">
                    <div class="form-group flex-1">
                        <label for="prioridade">Prioridade</label>
                        <select id="prioridade" name="prioridade">
                            <option value="Baixa">Baixa</option>
                            <option value="Média" selected>Média</option>
                            <option value="Alta">Alta</option>
                        </select>
                    </div>

                    <div class="form-group flex-1">
                        <label for="data_entrega">Prazo Limite</label>
                        <input type="date" id="data_entrega" name="data_entrega">
                    </div>
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição / Detalhes</label>
                    <textarea id="descricao" name="descricao" rows="4" placeholder="Adicione observações importantes ou sub-tarefas..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit-task">Adicionar Tarefa</button>
                    <a href="{{ url_for('dashboard_projeto', projeto_id=projeto[0]) }}" class="btn-cancel-task">← Voltar ao Painel</a>
                </div>

            </form>
        </div>
    </main>

</body>
</html>
