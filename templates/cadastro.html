<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Organizador de Tarefas - Cadastrar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <style>
        /* Fundo da página com o gradiente azul */
        body.auth-wrapper {
            background: linear-gradient(135deg, #182848, #4b6cb7);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        /* Card Transparente (Glassmorphism) */
        .auth-card {
            background: rgba(255, 255, 255, 0.15); /* Transparência branca */
            backdrop-filter: blur(10px); /* Vidro fosco */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
            box-sizing: border-box;
        }

        /* Títulos */
        .auth-card h2 {
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .auth-card p {
            color: rgba(255, 255, 255, 0.75);
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Grupos do formulário */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        /* Inputs em branco semi-opaco */
        .form-group input {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 4px;
            font-size: 15px;
            color: #333333;
            box-sizing: border-box;
            transition: background 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* Botão de Finalizar Cadastro personalizado */
        .btn-auth-submit {
            width: 100%;
            padding: 14px;
            background-color: #2ca35c; /* Ajustado para um verde que contrasta melhor com o branco */
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        .btn-auth-submit:hover {
            background-color: #217d46;
        }

        /* Link do rodapé */
        .auth-footer {
            margin-top: 25px;
            font-size: 12px;
        }

        .auth-footer a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .auth-footer a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        /* Alertas */
        .alert {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
            color: white;
            background: rgba(217, 83, 79, 0.8);
        }
    </style>
</head>
<body class="auth-wrapper">

    <div class="auth-card">
        <h2>Criar Conta</h2>
        <p>Insira seus dados para começar a gerenciar suas tarefas.</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form action="{{ url_for('cadastro') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="nome">NOME COMPLETO:</label>
                <input type="text" name="nome" id="nome" placeholder="Seu nome" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="email">E-MAIL:</label>
                <input type="email" name="email" id="email" placeholder="seuemail@link.com" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="senha">SENHA:</label>
                <input type="password" name="senha" id="senha" placeholder="Crie uma senha segura" required>
            </div>
            <button type="submit" class="btn-auth-submit">FINALIZAR CADASTRO</button>
        </form>
        
        <div class="auth-footer">
            <a href="{{ url_for('login') }}">JÁ TEM UMA CONTA? ENTRAR</a>
        </div>
    </div>

</body>
</html>
